<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Flow — 주치의 대시보드</title>
<style>
  :root {
    --paper: #3f4d2c;
    --paper-raised: #e5d7c4;
    --ink: #f2efe8;
    --ink-soft: #cfbb99;
    --moss-900: #f2efe8;
    --moss-700: #889063;
    --moss-500: #889063;
    --moss-200: #4a5530;
    --honey-600: #c4802a;
    --honey-500: #e6a03e;
    --honey-200: #5c4a20;
    --clay-600: #c45544;
    --clay-200: #f0d4c8;
    --mist: #4a5530;
    --line: #4a5530;
    --shadow: 80 20% 10%;
    --cafe: #4c3d19;
    --bone: #e5d7c4;
    --tan: #cfbb99;
    --font-display: "Trebuchet MS", "Century Gothic", ui-rounded, "Segoe UI Rounded", sans-serif;
    --font-body: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --font-stat: "Cascadia Code", "SF Mono", ui-monospace, "Consolas", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Topbar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px clamp(18px, 4vw, 44px);
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark {
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--moss-700);
    letter-spacing: 0.01em;
  }
  .brand-tag {
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .topbar-actions { display: flex; align-items: center; gap: 12px; }

  .logout-btn {
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: #4c3d19;
    font-weight: 600;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 0.82rem;
    font-family: var(--font-body);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .logout-btn:hover { border-color: var(--bone); color: #354024; }

  /* ---------- Main content ---------- */
  .main {
    padding: clamp(24px, 4vw, 56px) clamp(18px, 4vw, 44px);
    max-width: 1100px;
    margin: 0 auto;
  }

  .greeting {
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--moss-900);
    margin-bottom: 4px;
  }

  .greeting-sub {
    font-size: 0.88rem;
    color: var(--ink-soft);
    margin-bottom: 32px;
  }

  /* ---------- Patient cards grid ---------- */
  .patient-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .patient-card {
    background: var(--bone);
    border: 1px solid var(--tan);
    border-radius: 18px;
    padding: 22px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }
  .patient-card:hover {
    border-color: #4c3d19;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,.2);
    transform: translateY(-2px);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .card-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-size: 0.9rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .card-info .card-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: #354024;
  }

  .card-info .card-diag {
    font-size: 0.78rem;
    color: #5c5d4a;
    margin-top: 1px;
  }

  /* Status badge */
  .status-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-top: 10px;
    margin-bottom: 14px;
  }
  .status-badge.excellent {
    background: #354024;
    color: #e5d7c4;
  }
  .status-badge.good {
    background: #889063;
    color: #f2efe8;
  }
  .status-badge.needs-attention {
    background: #8b4a3a;
    color: #f5ebe6;
  }

  /* Stats row */
  .card-stats {
    display: flex;
    gap: 24px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-label {
    font-size: 0.72rem;
    color: #5c5d4a;
  }

  .stat-value {
    font-family: var(--font-stat);
    font-size: 0.88rem;
    font-weight: 600;
    color: #354024;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 환자 등록 모달 ---------- */
  .greeting-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .register-btn {
    border: none; border-radius: 10px; padding: 10px 18px; font-size: 0.85rem; font-weight: 700;
    background: var(--honey-500); color: var(--moss-900); cursor: pointer; font-family: var(--font-body);
    transition: background 0.12s;
  }
  .register-btn:hover { background: var(--honey-600); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20, 20, 10, 0.55); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--bone); border-radius: 18px; padding: 28px; max-width: 420px; width: 100%;
    box-shadow: 0 20px 60px -12px rgba(0,0,0,.4);
  }
  .modal-card h2 { font-family: var(--font-display); font-size: 1.2rem; color: #354024; margin-bottom: 6px; }
  .modal-sub { font-size: 0.8rem; color: #5c5d4a; margin-bottom: 20px; line-height: 1.5; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 0.8rem; font-weight: 600; color: #354024; margin-bottom: 6px; }
  .modal-field .lookup-row { display: flex; gap: 8px; }
  .modal-field input {
    flex: 1; border: 1px solid var(--tan); border-radius: 8px; padding: 9px 12px;
    font-size: 0.88rem; font-family: var(--font-body); background: #fff; color: #354024;
  }
  .modal-field input:focus { outline: none; border-color: #4c3d19; }
  .lookup-btn {
    border: 1px solid var(--line); background: var(--paper-raised); color: #4c3d19; font-weight: 700;
    border-radius: 8px; padding: 9px 14px; font-size: 0.8rem; cursor: pointer; font-family: var(--font-body);
    white-space: nowrap;
  }
  .lookup-btn:hover { border-color: #4c3d19; }
  .lookup-btn:disabled { opacity: 0.6; cursor: default; }
  .lookup-status { font-size: 0.78rem; margin-top: 6px; min-height: 1.1em; }
  .lookup-status.ok { color: #354024; }
  .lookup-status.error { color: #8b4a3a; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .modal-actions button {
    flex: 1; border: none; border-radius: 10px; padding: 11px; font-size: 0.88rem; font-weight: 700;
    cursor: pointer; font-family: var(--font-body);
  }
  .modal-cancel-btn { background: var(--paper-raised); color: #4c3d19; border: 1px solid var(--line); }
  .modal-submit-btn { background: var(--moss-700); color: #fff; }
  .modal-submit-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="/dashboard" style="text-decoration:none;"><span class="brand-mark"><img src="/assets/logo.png" alt="" style="width:2.2rem;height:2.2rem;object-fit:contain;vertical-align:middle;margin-right:6px;">Care Flow</span></a>
    <span class="brand-tag" id="brand-tag">주치의 대시보드</span>
  </div>
  <div class="topbar-actions">
    <button class="logout-btn" id="logout-btn" type="button">로그아웃</button>
  </div>
</header>

<main class="main">
  <div class="greeting-row">
    <h1 class="greeting" id="greeting">안녕하세요, 선생님</h1>
    <button class="register-btn" id="open-register-btn" type="button">+ 환자 등록</button>
  </div>
  <p class="greeting-sub" id="greeting-sub">담당 환자 0명</p>

  <div class="patient-grid" id="patient-grid"></div>
</main>

<div class="modal-overlay" id="register-modal">
  <div class="modal-card">
    <h2>환자 등록</h2>
    <p class="modal-sub">병원 고유 ID를 입력하고 조회하면 환자 정보가 자동으로 채워집니다.</p>

    <div class="modal-field">
      <label for="lookup-unique-id">병원 고유 ID (5자리)</label>
      <div class="lookup-row">
        <input type="text" id="lookup-unique-id" placeholder="예: 13905" maxlength="5" inputmode="numeric">
        <button class="lookup-btn" id="lookup-btn" type="button">조회</button>
      </div>
      <div class="lookup-status" id="lookup-status"></div>
    </div>

    <div class="modal-field">
      <label for="reg-name">이름</label>
      <input type="text" id="reg-name" placeholder="환자 이름">
    </div>
    <div class="modal-field">
      <label for="reg-age">나이</label>
      <input type="number" id="reg-age" placeholder="나이" min="1">
    </div>
    <div class="modal-field">
      <label for="reg-diagnosis">진단명</label>
      <input type="text" id="reg-diagnosis" placeholder="진단명">
    </div>

    <div class="modal-actions">
      <button class="modal-cancel-btn" id="cancel-register-btn" type="button">취소</button>
      <button class="modal-submit-btn" id="submit-register-btn" type="button">등록</button>
    </div>
  </div>
</div>

<style>
  /* ---------- 챗봇 위젯 ---------- */
  .chatbot-fab { position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#4c3d19,#889063); color:#e5d7c4; border:none; cursor:pointer; display:grid; place-items:center; box-shadow:0 6px 24px -4px rgba(0,0,0,.4); z-index:100; transition:transform .12s; font-size:1.2rem; font-weight:700; }
  .chatbot-fab:hover { transform:scale(1.08); }
  .chatbot-panel { position:fixed; bottom:90px; right:24px; width:360px; max-height:460px; background:#cfbb99; border:1px solid #cfbb99; border-radius:18px; box-shadow:0 20px 50px -12px rgba(0,0,0,.3); z-index:100; display:none; flex-direction:column; overflow:hidden; }
  .chatbot-panel.open { display:flex; }
  .chatbot-header { padding:14px 18px; border-bottom:1px solid #3a2e12; font-family:var(--font-display); font-size:0.95rem; color:#e5d7c4; background:#4c3d19; border-radius:18px 18px 0 0; }
  .chatbot-messages { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-height:260px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; font-size:0.85rem; line-height:1.5; }
  .msg.bot { background:#e5d7c4; color:#354024; align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.user { background:#354024; color:#e5d7c4; align-self:flex-end; border-bottom-right-radius:4px; }
  .chatbot-input { display:flex; gap:8px; padding:12px 14px; border-top:1px solid #b8a580; }
  .chatbot-input input { flex:1; border:1px solid #b8a580; border-radius:10px; padding:9px 12px; font-size:0.85rem; font-family:var(--font-body); background:#e5d7c4; color:#354024; }
  .chatbot-input input:focus { outline:none; border-color:#4c3d19; }
  .chatbot-input button { border:none; border-radius:10px; padding:9px 14px; background:#4c3d19; color:#e5d7c4; font-size:0.82rem; font-weight:600; cursor:pointer; font-family:var(--font-body); }
  .chatbot-input button:hover { background:#354024; }
</style>

<!-- 챗봇 위젯 -->
<button class="chatbot-fab" id="chatbot-fab" type="button" aria-label="AI 어시스턴트"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></button>
<div class="chatbot-panel" id="chatbot-panel">
  <div class="chatbot-header">AI 어시스턴트 — 환자 정보 문의</div>
  <div class="chatbot-messages" id="chatbot-messages">
    <div class="msg bot">안녕하세요, 선생님. 담당 환자에 대해 궁금한 점을 물어보세요.</div>
  </div>
  <div class="chatbot-input">
    <input type="text" id="chatbot-input-field" placeholder="환자에 대해 질문하기">
    <button id="chatbot-send-btn" type="button">전송</button>
  </div>
</div>

<script>
  // 챗봇 위젯
  const fab = document.getElementById('chatbot-fab');
  const panel = document.getElementById('chatbot-panel');
  const msgContainer = document.getElementById('chatbot-messages');
  const inputField = document.getElementById('chatbot-input-field');
  const sendBtn = document.getElementById('chatbot-send-btn');

  fab.addEventListener('click', () => {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      msgContainer.scrollTop = msgContainer.scrollHeight;
      inputField.focus();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
  inputField.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  async function sendMessage() {
    const text = inputField.value.trim();
    if (!text) return;
    appendMsg('user', text);
    inputField.value = '';

    sendBtn.disabled = true;
    inputField.disabled = true;
    try {
      const res = await apiFetch('/api/doctor/chat', {
        method: 'POST',
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      appendMsg('bot', data.reply || '죄송합니다, 지금은 답변할 수 없습니다.');
    } catch (err) {
      appendMsg('bot', '죄송합니다, 지금은 답변할 수 없습니다.');
    } finally {
      sendBtn.disabled = false;
      inputField.disabled = false;
      inputField.focus();
    }
  }

  function appendMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    msgContainer.appendChild(div);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }
</script>

<script src="/config.js"></script>
<script>
  const AVATAR_COLORS = ['#45441a', '#7e9da2', '#898433', '#a24a34', '#dc9a3c'];

  async function init() {
    // localStorage에서 사용자 정보 확인
    const user = Auth.getUser();
    if (!user || user.role !== 'doctor') {
      window.location.href = '/login.html';
      return;
    }

    document.getElementById('greeting').textContent = `안녕하세요, ${user.name} 선생님`;

    // 담당 환자 목록 + 요약 데이터
    const res = await apiFetch('/api/doctor/patients-summary');
    let patients = await res.json();
    if (!res.ok || !Array.isArray(patients)) {
      console.error('담당 환자 목록을 불러오지 못했습니다:', patients);
      patients = [];
    }

    const today = new Date();
    const dateStr = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;
    document.getElementById('greeting-sub').textContent = `담당 환자 ${patients.length}명 · ${dateStr}`;

    const grid = document.getElementById('patient-grid');
    grid.innerHTML = '';

    patients.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'patient-card';
      card.dataset.patientId = p.id;

      // 아바타 색상
      const color = AVATAR_COLORS[i % AVATAR_COLORS.length];
      // 이름 첫 글자
      const initial = p.name.charAt(0);

      // 등록 후 경과 주수
      const regDate = new Date(p.registered_at);
      const weeks = Math.floor((today - regDate) / (7 * 24 * 60 * 60 * 1000));
      const durationText = weeks > 0 ? `${weeks}주차` : '1주차';

      // 진단명 축약
      const diagShort = p.diagnosis.length > 12 ? p.diagnosis.slice(0, 12) + '…' : p.diagnosis;

      // 출석률 뱃지
      let badgeClass = 'good';
      let badgeText = '양호';
      if (p.weekly_rate >= 80) {
        badgeClass = 'excellent';
        badgeText = '우수';
      } else if (p.weekly_rate < 50) {
        badgeClass = 'needs-attention';
        badgeText = '관심 필요';
      }

      // 마지막 활동
      let lastActivity = '없음';
      if (p.last_activity) {
        const lastDate = new Date(p.last_activity);
        const diffDays = Math.floor((today - lastDate) / (24 * 60 * 60 * 1000));
        if (diffDays === 0) lastActivity = '오늘';
        else if (diffDays === 1) lastActivity = '어제';
        else lastActivity = `${diffDays}일 전`;
      }

      card.innerHTML = `
        <div class="card-header">
          <div class="card-avatar" style="background:${color}">${initial}</div>
          <div class="card-info">
            <div class="card-name">${p.name}</div>
            <div class="card-diag">${diagShort} · ${durationText}</div>
          </div>
        </div>
        <span class="status-badge ${badgeClass}">${badgeText}</span>
        <div class="card-stats">
          <div class="stat-item">
            <span class="stat-label">최근 7일 출석률</span>
            <span class="stat-value">${p.weekly_rate}%</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">마지막 활동</span>
            <span class="stat-value">${lastActivity}</span>
          </div>
        </div>
      `;

      card.addEventListener('click', () => {
        // 환자 상세 페이지로 이동 (추후 구현)
        window.location.href = `/doctor/patient/${p.id}`;
      });

      grid.appendChild(card);
    });
  }

  // 로그아웃
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await apiFetch('/api/logout', { method: 'POST' });
    Auth.clear();
    window.location.href = '/login.html';
  });

  init();
</script>

<script>
  // --- 환자 등록 모달 ---
  const registerModal = document.getElementById('register-modal');
  const openRegisterBtn = document.getElementById('open-register-btn');
  const cancelRegisterBtn = document.getElementById('cancel-register-btn');
  const submitRegisterBtn = document.getElementById('submit-register-btn');
  const lookupBtn = document.getElementById('lookup-btn');
  const lookupInput = document.getElementById('lookup-unique-id');
  const lookupStatus = document.getElementById('lookup-status');
  const regNameInput = document.getElementById('reg-name');
  const regAgeInput = document.getElementById('reg-age');
  const regDiagnosisInput = document.getElementById('reg-diagnosis');
  let lookedUpJoint = null;

  function resetRegisterForm() {
    lookupInput.value = '';
    regNameInput.value = '';
    regAgeInput.value = '';
    regDiagnosisInput.value = '';
    lookupStatus.textContent = '';
    lookupStatus.className = 'lookup-status';
    lookedUpJoint = null;
  }

  openRegisterBtn.addEventListener('click', () => {
    resetRegisterForm();
    registerModal.classList.add('open');
  });

  cancelRegisterBtn.addEventListener('click', () => {
    registerModal.classList.remove('open');
  });

  registerModal.addEventListener('click', (e) => {
    if (e.target === registerModal) registerModal.classList.remove('open');
  });

  lookupBtn.addEventListener('click', async () => {
    const uid = lookupInput.value.trim();
    if (!uid) return;

    lookupBtn.disabled = true;
    lookupStatus.textContent = '병원 정보에서 조회 중이에요...';
    lookupStatus.className = 'lookup-status';

    try {
      const res = await apiFetch(`/api/hospital-lookup/${encodeURIComponent(uid)}`);
      if (res.status === 404) {
        lookupStatus.textContent = '일치하는 환자 정보를 찾을 수 없어요. ID를 다시 확인해주세요.';
        lookupStatus.className = 'lookup-status error';
        return;
      }
      if (!res.ok) {
        lookupStatus.textContent = '조회 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.';
        lookupStatus.className = 'lookup-status error';
        return;
      }
      const data = await res.json();
      regNameInput.value = data.name || '';
      regAgeInput.value = data.age || '';
      regDiagnosisInput.value = data.diagnosis || '';
      lookedUpJoint = data.joint || null;
      lookupStatus.textContent = `병원 정보에서 ${data.name}님 정보를 불러왔어요. 확인 후 등록해주세요.`;
      lookupStatus.className = 'lookup-status ok';
    } catch (err) {
      lookupStatus.textContent = '조회 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.';
      lookupStatus.className = 'lookup-status error';
    } finally {
      lookupBtn.disabled = false;
    }
  });

  submitRegisterBtn.addEventListener('click', async () => {
    const name = regNameInput.value.trim();
    if (!name) {
      lookupStatus.textContent = '이름을 입력해주세요.';
      lookupStatus.className = 'lookup-status error';
      return;
    }

    submitRegisterBtn.disabled = true;
    try {
      const res = await apiFetch('/api/patients', {
        method: 'POST',
        body: JSON.stringify({
          name,
          age: regAgeInput.value ? parseInt(regAgeInput.value) : null,
          diagnosis: regDiagnosisInput.value.trim(),
          joint: lookedUpJoint,
        }),
      });
      if (!res.ok) {
        lookupStatus.textContent = '등록에 실패했어요. 입력값을 확인해주세요.';
        lookupStatus.className = 'lookup-status error';
        return;
      }
      const patient = await res.json();
      registerModal.classList.remove('open');
      await init();
      alert(`${patient.name}님 등록 완료! 환자 고유번호(카톡 신원확인용): ${patient.id}`);
    } catch (err) {
      lookupStatus.textContent = '등록 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.';
      lookupStatus.className = 'lookup-status error';
    } finally {
      submitRegisterBtn.disabled = false;
    }
  });
</script>

</body>
</html>
