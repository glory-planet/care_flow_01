<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Flow — 로그인</title>
<style>
  :root {
    --paper: #3f4d2c;
    --paper-raised: #e5d7c4;
    --ink: #f2efe8;
    --ink-soft: #cfbb99;
    --moss-900: #f2efe8;
    --moss-700: #889063;
    --moss-500: #889063;
    --moss-200: #4a5530;
    --honey-600: #c4802a;
    --honey-500: #e6a03e;
    --honey-200: #5c4a20;
    --clay-600: #c45544;
    --clay-200: #f0d4c8;
    --mist: #4a5530;
    --line: #4a5530;
    --shadow: 80 20% 10%;
    --cafe: #4c3d19;
    --bone: #e5d7c4;
    --tan: #cfbb99;
    --font-display: "Trebuchet MS", "Century Gothic", ui-rounded, "Segoe UI Rounded", sans-serif;
    --font-body: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --font-stat: "Cascadia Code", "SF Mono", ui-monospace, "Consolas", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .login-container {
    width: min(420px, 90vw);
    text-align: center;
  }

  .brand-title {
    font-family: var(--font-display);
    font-size: 2rem;
    color: var(--bone);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .brand-logo {
    width: 2rem;
    height: 2rem;
    object-fit: contain;
  }

  .login-logo {
    width: 240px;
    height: 240px;
    object-fit: contain;
    margin-bottom: 20px;
  }

  .brand-sub {
    font-size: 0.88rem;
    color: var(--tan);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .login-form {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group label {
    font-size: 0.82rem;
    color: var(--tan);
    font-weight: 500;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--tan);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: var(--font-body);
    background: var(--bone);
    color: #354024;
    transition: border-color 0.15s ease;
  }

  .form-group input:focus {
    outline: none;
    border-color: var(--moss-700);
    box-shadow: 0 0 0 3px rgba(136, 144, 99, 0.2);
  }

  .form-group input::placeholder {
    color: #a0977e;
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #4c3d19;
    color: var(--bone);
    font-size: 0.95rem;
    font-weight: 600;
    font-family: var(--font-body);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    margin-top: 4px;
  }

  .login-btn:hover {
    background: #3a2e12;
  }

  .login-btn:active {
    transform: scale(0.98);
  }

  .login-btn:focus-visible {
    outline: 2px solid var(--honey-500);
    outline-offset: 2px;
  }

  .error-msg {
    text-align: center;
    font-size: 0.82rem;
    color: var(--clay-600);
    min-height: 1.4em;
    margin-top: 2px;
  }

  .demo-info {
    margin-top: 28px;
    text-align: left;
    padding: 18px;
    background: #3d4a2a;
    border: 1px solid #4a5530;
    border-radius: 12px;
  }

  .demo-info-title {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--tan);
    margin-bottom: 8px;
  }

  .demo-info-item {
    font-size: 0.8rem;
    color: var(--tan);
    line-height: 1.7;
    font-family: var(--font-stat);
  }

  .demo-info-item .role-tag {
    font-family: var(--font-body);
    color: var(--tan);
  }
</style>
</head>
<body>

<div class="login-container">
  <img src="/assets/logo.png" alt="Care Flow 로고" class="login-logo">
  <p class="brand-sub">아이디로 로그인하면 환자/주치의 화면이 자동으로 구분됩니다</p>

  <form class="login-form" id="login-form">
    <div class="form-group">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" placeholder="patient1" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" placeholder="" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn">로그인</button>
    <div class="error-msg" id="error-msg"></div>
  </form>
</div>

<script src="/config.js"></script>
<script>
  const form = document.getElementById('login-form');
  const errorMsg = document.getElementById('error-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      errorMsg.textContent = '아이디와 비밀번호를 입력해 주세요.';
      return;
    }

    try {
      const res = await apiFetch('/api/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });

      const data = await res.json();

      if (data.ok) {
        // 토큰과 사용자 정보 저장
        if (data.token) Auth.setToken(data.token);
        Auth.setUser({ username, role: data.role, name: data.name, patient_id: data.patient_id, patient_ids: data.patient_ids });
        // 역할에 따라 리다이렉트
        if (data.role === 'doctor') {
          window.location.href = '/doctor.html';
        } else {
          window.location.href = '/patient.html';
        }
      } else {
        errorMsg.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
      }
    } catch (err) {
      errorMsg.textContent = '서버 연결에 실패했습니다.';
    }
  });
</script>

</body>
</html>
